# Crash TWOC settings, written by the settings overlay (F1 in the game window).
# run_twoc.ps1 switches and RECOMP_* variables win over these. Delete the file for the defaults.
# The Acer Nitro 5 package's starting point (twoc/tools/package -Target Nitro5, notes 18.100): 16:9 at the
# screen's own size (native, 1920x1080) in a window, interpolated frames at the display's rate (144 Hz: 2.4
# frames for each game frame; 72 fps is even there too), the render thread by core count, the adaptive
# frame rate on, baked draws on (the default), no anti-aliasing or ambient occlusion (the RTX 3050 has 4 GB),
# the Detailed frame-rate counter, the HUD at the screen's edges, the title animation skipped, and the
# graphics card Automatic (Windows' choice; the game asks for the NVIDIA GPU: README part A).
# Full screen stays off at first (README part C, test 5).
fullscreen = 0           # 1: borderless over the whole screen (Alt+Enter switches at any time)
widescreen = 1           # the aspect ratio: 0 (4:3), 1 (16:9) or W:H (16:10, 21:9)
render_size = native           # game (480 lines), WxH or native
pacing = auto           # auto, vsync, limiter or limiter+vsync
anisotropy = 4           # 1 (the game's filtering), 2, 4, 8 or 16
antialiasing = off           # off, fxaa, smaa, msaa2x, msaa4x, msaa8x, or msaa2x+smaa, msaa4x+smaa, msaa8x+smaa (MSAA, then SMAA)
ao = off           # off, ssao or gtao: ambient occlusion
framerate = display           # 60 (the game's), display (interpolated frames at the display's rate) or a rate in Hz (72, 90, 120, 144, ...)
adaptive_framerate = 1           # 1: fewer interpolated frames while game frames run late, 0: always the display's count
render_thread = auto           # auto (on with 4 or more processor cores), on or off
show_fps = 2           # 1: the game's updates and the frames shown a second in the picture's corner; 2: also the threads, the CPU and the power (Detailed)
hud = edges           # centre (the game's 4:3 places) or edges: the HUD counters at the screen's edges, wider than 4:3
pause = 0           # 1: the game waits while the overlay is open, 0: it runs behind it (so the overlay's fps line is live)
fast_title = 1           # 1: the title animation runs fast, so the main menu opens sooner (from the next start)
gpu = auto           # auto (Windows' choice; the game asks for the high-performance card) or a graphics card's name as the F1 menu's Display tab lists it (from the next start)
